name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Throwaway CI-only values. Real secrets live in the host's secret store.
  DATABASE_URL: postgresql://heir:heir@localhost:5432/heirfinder?schema=public
  DATABASE_URL_TEST: postgresql://heir:heir@localhost:5432/heirfinder_test?schema=public
  BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  PII_HMAC_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
  MOCK_MODE: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit + integration tests, evals
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heir
          POSTGRES_PASSWORD: heir
          POSTGRES_DB: heirfinder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heir" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run evals

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heir
          POSTGRES_PASSWORD: heir
          POSTGRES_DB: heirfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heir" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Migrate and seed FAKE demo data
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - run: npm run test:e2e -- --trace off
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
