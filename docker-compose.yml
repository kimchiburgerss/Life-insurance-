# Local development
#   docker compose up -d db                 # just Postgres, then `npm run dev`
#   docker compose --profile app up --build # Postgres + migrations + app container
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: heir
      POSTGRES_PASSWORD: heir
      POSTGRES_DB: heirfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heir -d heirfinder"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://heir:heir@db:5432/heirfinder?schema=public
      # Load the FAKE demo data too (never set this in production).
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["app"]
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      DATABASE_URL: postgresql://heir:heir@db:5432/heirfinder?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      # Plain HTTP on localhost; production always runs behind HTTPS.
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
